[project]
name = "4thealth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "pysnmp>=7.1.28",
    "cryptography>=50.0.0",
    "pyzipper>=0.4.0",
    "paramiko>=5.0.0",
    "pyyaml>=6.0.3",
    "anthropic>=1.0.0",
    "openai>=3.3.1",
    "scp>=0.16.1",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
prod = ["gunicorn>=26.2.0"]

[tool.uv]
package = false

[tool.ruff.lint]
# BLE001/S110/S112: this codebase relies heavily and deliberately on broad
# "catch, log, degrade gracefully" exception handling — background scheduler
# startup that must never crash the app, best-effort usage/metrics tracking,
# cleanup code that must not fail the caller, narration/AI calls that must
# always fall back to a deterministic result. Narrowing these to specific
# exception types would defeat the point of that pattern, not improve it.
ignore = ["BLE001", "S110", "S112"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
