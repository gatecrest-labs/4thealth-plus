[project]
name = "4thealth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3,<4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "apscheduler>=3.11.3",
    "openpyxl>=3.1.5",
    "pysnmp>=7.1.29",
    "cryptography>=50.0.1",
    "pyzipper>=0.4.0",
    "paramiko>=5.0.0",
    "pyyaml>=6.0.3",
    "anthropic>=1.6.0",
    "openai>=3.11.0",
    "scp>=0.16.1",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
prod = ["gunicorn>=26.2.0"]

[tool.uv]
package = false

[tool.ruff.lint]
# BLE001/S110/S112: this codebase relies heavily and deliberately on broad
# "catch, log, degrade gracefully" exception handling — background scheduler
# startup that must never crash the app, best-effort usage/metrics tracking,
# cleanup code that must not fail the caller, narration/AI calls that must
# always fall back to a deterministic result. Narrowing these to specific
# exception types would defeat the point of that pattern, not improve it.
#
# TRY002/B017: the test suite exercises that same broad-catch pattern by
# raising/asserting a plain `Exception` as a stand-in for "any upstream
# failure" (an FMG call, a proxy call, a device fetch) — the code under
# test is deliberately supposed to catch it via `except Exception`, so a
# narrower test double would test something the production code doesn't
# actually promise. Same rationale as the three rules above, scoped to
# tests/ only since production code should still define real exception
# types where it raises its own.
ignore = ["BLE001", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TRY002", "B017"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
